[workspace]

resolver = "3"

members = [
    "crates/hypershell",
    "crates/hypershell-components",
    "crates/hypershell-json-components",
    "crates/hypershell-reqwest-components",
    "crates/hypershell-tokio-components",
    "crates/hypershell-tungstenite-components",
    "crates/hypershell-macro",
    "crates/hypershell-examples",
    "crates/hypershell-hash-components",
]

[workspace.package]
rust-version    = "1.90"
edition         = "2024"
license         = "MIT"
repository      = "https://github.com/contextgeneric/hypershell"
homepage        = "https://contextgeneric.dev/docs/projects/hypershell/"
categories      = ["command-line-interface", "rust-patterns"]
authors         = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords        = ["cgp", "dsl", "shell", "type-level"]

[workspace.dependencies]
cgp                 = { version = "0.8.0" }
cgp-error-anyhow    = { version = "0.8.0" }
futures             = { version = "0.3.34" }
hex                 = { version = "0.4.3" }
itertools           = { version = "0.14.0" }
proc-macro2         = { version = "1.0.107" }
quote               = { version = "1.0.47" }
reqwest             = { version = "0.12.28" }
serde               = { version = "1.0.229", default-features = false }
serde_json          = { version = "1.0.154", default-features = false }
sha2                = { version = "0.10.9" }
tokio               = { version = "1.54.1" }
tokio-tungstenite   = { version = "0.26.2" }
tokio-util          = { version = "0.7.20" }
url                 = { version = "2.5.8" }

hypershell                          = { version =  "0.2.0", path = "./crates/hypershell" }
hypershell-components               = { version =  "0.2.0", path = "./crates/hypershell-components" }
hypershell-json-components          = { version =  "0.2.0", path = "./crates/hypershell-json-components" }
hypershell-reqwest-components       = { version =  "0.2.0", path = "./crates/hypershell-reqwest-components" }
hypershell-tokio-components         = { version =  "0.2.0", path = "./crates/hypershell-tokio-components" }
hypershell-tungstenite-components   = { version =  "0.2.0", path = "./crates/hypershell-tungstenite-components" }
hypershell-hash-components          = { version =  "0.2.0", path = "./crates/hypershell-hash-components" }
hypershell-macro                    = { version =  "0.2.0", path = "./crates/hypershell-macro" }
