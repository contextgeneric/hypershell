[package]
name         = "hypershell-tungstenite-components"
version      =  "0.2.0-prerelease"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
categories   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
keywords     = { workspace = true }
description  = "Native WebSocket handlers for Hypershell, built on tokio-tungstenite."

[dependencies]
hypershell-components           = { workspace = true }
hypershell-tokio-components     = { workspace = true }

cgp                     = { workspace = true }
futures                 = { workspace = true }
tokio                   = { workspace = true }
tokio-tungstenite       = { workspace = true, features = [ "native-tls" ] }
tokio-util              = { workspace = true, features = [ "compat", "io" ] }
