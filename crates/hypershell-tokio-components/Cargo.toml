[package]
name         = "hypershell-tokio-components"
version      =  "0.1.0"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
categories   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
keywords     = { workspace = true }
description  = "Tokio-based handlers for executing commands and handling file I/O in Hypershell."

[dependencies]
hypershell-components   = { workspace = true }

cgp                     = { workspace = true }
itertools               = { workspace = true }
futures                 = { workspace = true }
tokio                   = { workspace = true, features = [ "process", "fs", "rt", "io-util", "io-std" ] }
tokio-util              = { workspace = true, features = [ "compat", "codec", "io" ] }
